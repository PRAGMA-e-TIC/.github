# Workflow réutilisable — CI Python (lint + tests)
#
# Usage dans un repo applicatif :
#
# jobs:
#   ci:
#     uses: pragma-e-tic/.github/.github/workflows/reusable-ci-python.yml@main
#     with:
#       python-version: "3.12"
#       run-tests: true

name: CI Python (réutilisable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Version Python (ex: 3.12)"
        type: string
        required: false
        default: "3.12"
      run-tests:
        description: "Lancer pytest"
        type: boolean
        required: false
        default: true
      working-directory:
        description: "Répertoire de travail (mono-repo)"
        type: string
        required: false
        default: "."

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --all-extras --dev

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — format check
        run: uv run ruff format --check .

  test:
    needs: lint
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --all-extras --dev

      - name: pytest
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/test
        run: uv run pytest -q --cov --cov-report=term
